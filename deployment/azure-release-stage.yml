# Append this stage to azure-pipelines.yml after configuring the TaskFlow-SSH
# service connection and taskflow-production environment in Azure DevOps.
- stage: Deploy
 dependsOn: Package
 condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
 jobs:
 - deployment: Production
   environment: taskflow-production
   pool: {vmImage: ubuntu-latest}
   strategy:
    runOnce:
     deploy:
      steps:
      - checkout: self
      - download: current
        artifact: release
      - task: CopyFilesOverSSH@0
        inputs:
         sshEndpoint: TaskFlow-SSH
         sourceFolder: '$(Pipeline.Workspace)/release'
         contents: taskflow.tar.gz
         targetFolder: /opt/taskflow
      - task: SSH@0
        inputs:
         sshEndpoint: TaskFlow-SSH
         runOptions: inline
         inline: |
          set -eu
          cd /opt/taskflow
          tar -xzf taskflow.tar.gz
          sudo env COMPOSE_PARALLEL_LIMIT=1 docker compose -f docker-compose.prod.yml up -d --build --wait --wait-timeout 300
         failOnStdErr: false
      - script: python3 scripts/smoke.py "$(TASKFLOW_PUBLIC_URL)"
        displayName: Verify deployed app
