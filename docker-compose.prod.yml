version: '3.8'

services:

  userdb:
    image: postgres:15
    container_name: userdb
    environment:
      POSTGRES_DB: users
      POSTGRES_USER: ${USER_DB_USERNAME}
      POSTGRES_PASSWORD: ${USER_DB_PASSWORD}
    ports:
      - "5433:5432"

  taskdb:
    image: postgres:15
    container_name: taskdb
    environment:
      POSTGRES_DB: tasks
      POSTGRES_USER: ${TASK_DB_USERNAME}
      POSTGRES_PASSWORD: ${TASK_DB_PASSWORD}
    ports:
      - "5434:5432"

  userservice:
    build:
      image: casestudy2026acr.azurecr.io/userservice:44
    container_name: userservice
    env_file: .env
    environment:
      SPRING_DATASOURCE_URL: ${USER_DB_URL}
      SPRING_DATASOURCE_USERNAME: ${USER_DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${USER_DB_PASSWORD}
    depends_on:
      - userdb
    ports:
      - "8080:8080"

  taskservice:
    build:
      image: casestudy2026acr.azurecr.io/taskservice:44
    container_name: taskservice
    env_file: .env
    environment:
      SPRING_DATASOURCE_URL: ${TASK_DB_URL}
      SPRING_DATASOURCE_USERNAME: ${TASK_DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${TASK_DB_PASSWORD}
      USERSERVICE_URL: ${USERSERVICE_URL}
    depends_on:
      - taskdb
      - userservice
    ports:
      - "8081:8081"

  apigateway:
    build:
      image: casestudy2026acr.azurecr.io/apigateway:44
    container_name: apigateway
    env_file: .env
    environment:
      USERSERVICE_URL: ${USERSERVICE_URL}
      TASKSERVICE_URL: ${TASKSERVICE_URL}
    depends_on:
      - userservice
      - taskservice
    ports:
      - "8000:8000"
