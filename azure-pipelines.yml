trigger:
 branches:
  include: [main, master, develop]
pr:
 branches:
  include: [main, master, develop]
variables:
 nodeVersion: '22.x'
stages:
- stage: Verify
 displayName: Build and verify
 jobs:
 - job: Java
   pool: {vmImage: ubuntu-latest}
   steps:
   - task: JavaToolInstaller@0
     inputs: {versionSpec: '17', jdkArchitectureOption: x64, jdkSourceOption: PreInstalled}
   - script: python3 -m unittest discover -s scripts/tests -v
     displayName: Verify release promotion and rollback
   - task: Maven@4
     inputs:
      mavenPomFile: backend/pom.xml
      goals: clean verify
      publishJUnitResults: true
      testResultsFiles: '**/surefire-reports/TEST-*.xml'
   - task: PublishPipelineArtifact@1
     inputs: {targetPath: backend, artifact: backend-verification}
 - job: Browser
   pool: {vmImage: ubuntu-latest}
   steps:
   - task: NodeTool@0
     inputs: {versionSpec: '$(nodeVersion)'}
   - task: JavaToolInstaller@0
     inputs: {versionSpec: '17', jdkArchitectureOption: x64, jdkSourceOption: PreInstalled}
   - script: npm ci && npm run build && npm test && npx playwright install --with-deps chromium
     workingDirectory: frontend
     displayName: Build frontend and install test browser
   - script: npm run test:e2e
     workingDirectory: frontend
     displayName: Test real full-stack browser flows
   - task: PublishPipelineArtifact@1
     condition: failed()
     inputs: {targetPath: frontend/test-results, artifact: browser-failures}
- stage: Package
 dependsOn: Verify
 condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))
 jobs:
 - job: Bundle
   pool: {vmImage: ubuntu-latest}
   steps:
   - script: git archive --format=tar.gz --output="$(Build.ArtifactStagingDirectory)/taskflow.tar.gz" HEAD
     displayName: Package deployment source
   - publish: '$(Build.ArtifactStagingDirectory)/taskflow.tar.gz'
     artifact: release
# Optional release stage is documented in deployment/README.md.
# No Azure resources or cloud charges are created by this verification pipeline.
