trigger:
 branches:
  include: [main, master, develop]
pr:
 branches:
  include: [main, master, develop]
variables:
 nodeVersion: '22.x'
stages:
- stage: Verify
 displayName: Build and verify
 jobs:
 - job: Java
   pool: {vmImage: ubuntu-latest}
   steps:
   - task: JavaToolInstaller@0
     inputs: {versionSpec: '17', jdkArchitectureOption: x64, jdkSourceOption: PreInstalled}
   - script: python3 -m unittest discover -s scripts/tests -v
     displayName: Verify release promotion and rollback
   - task: Maven@4
     inputs:
      mavenPomFile: backend/pom.xml
      goals: clean verify
      publishJUnitResults: true
      testResultsFiles: '**/surefire-reports/TEST-*.xml'
   - task: CopyFiles@2
     inputs:
      SourceFolder: backend
      Contents: '**/target/site/jacoco/**'
      TargetFolder: '$(Build.ArtifactStagingDirectory)/coverage'
   - publish: '$(Build.ArtifactStagingDirectory)/coverage'
     artifact: backend-coverage
 - job: Browser
   pool: {vmImage: ubuntu-latest}
   steps:
   - task: NodeTool@0
     inputs: {versionSpec: '$(nodeVersion)'}
   - script: npm ci && npm run build && npm test && npx playwright install --with-deps chromium
     workingDirectory: frontend
     displayName: Build frontend and install test browser
   - script: |
      python3 scripts/setup.py
      COMPOSE_PARALLEL_LIMIT=1 docker compose up -d --build --wait --wait-timeout 300
      python3 scripts/smoke.py http://127.0.0.1:8088 --wait-seconds 60
     displayName: Verify production containers and PostgreSQL
   - script: npm run test:e2e
     workingDirectory: frontend
     env:
      TASKFLOW_BASE_URL: http://127.0.0.1:8088
     displayName: Test real full-stack browser flows
   - script: docker compose logs --tail=100
     condition: failed()
     displayName: Collect container diagnostics
   - script: docker compose down
     condition: always()
     displayName: Stop the isolated verification stack
   - task: PublishPipelineArtifact@1
     condition: failed()
     inputs: {targetPath: frontend/test-results, artifact: browser-failures}
- stage: Package
 dependsOn: Verify
 condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))
 jobs:
 - job: Bundle
   pool: {vmImage: ubuntu-latest}
   steps:
   - script: git archive --format=tar.gz --output="$(Build.ArtifactStagingDirectory)/taskflow.tar.gz" HEAD
     displayName: Package deployment source
   - publish: '$(Build.ArtifactStagingDirectory)/taskflow.tar.gz'
     artifact: release
# Optional release stage is documented in deployment/README.md.
# No Azure resources or cloud charges are created by this verification pipeline.
