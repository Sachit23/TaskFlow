spring.application.name=taskservice
server.port=8081
spring.datasource.url=${TASK_DB_URL}
spring.datasource.username=${TASK_DB_USERNAME}
spring.datasource.password=${TASK_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.flyway.enabled=true
server.error.include-message=never
server.error.include-stacktrace=never
server.shutdown=graceful
server.tomcat.max-http-form-post-size=1MB
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
userservice.url=${USERSERVICE_URL:http://localhost:8080}
spring.mvc.log-request-details=false
logging.level.org.springframework.web=INFO
