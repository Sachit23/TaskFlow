spring.application.name=apigateway
server.port=8090
server.shutdown=graceful
spring.cloud.gateway.server.webflux.routes[0].id=users
spring.cloud.gateway.server.webflux.routes[0].uri=${USERSERVICE_URL:http://localhost:8080}
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/users/**
spring.cloud.gateway.server.webflux.routes[1].id=tasks
spring.cloud.gateway.server.webflux.routes[1].uri=${TASKSERVICE_URL:http://localhost:8081}
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/tasks/**,/api/projects/**,/api/activity/**
spring.cloud.gateway.server.webflux.httpclient.connect-timeout=3000
spring.cloud.gateway.server.webflux.httpclient.response-timeout=15s
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
