spring.application.name=apigateway

# Server Configuration
server.port=8090

# User Service Route
spring.cloud.gateway.routes[0].id=user-service
spring.cloud.gateway.routes[0].uri=http://userservice:8080
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/users/**

# Task Service Route
spring.cloud.gateway.routes[1].id=task-service
spring.cloud.gateway.routes[1].uri=http://taskservice:8081
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/tasks/**