apiVersion: v1
kind: ConfigMap
metadata:
  name: apigateway-config
data:
  USERSERVICE_URL: http://userservice:8080
  TASKSERVICE_URL: http://taskservice:8081

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: apigatewayservice
spec:
  replicas: 1
  selector:
    matchLabels:
      app: apigatewayservice
  template:
    metadata:
      labels:
        app: apigatewayservice
    spec:
      containers:
        - name: apigateway
          image: apigateway-service:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8090
          envFrom:
            - configMapRef:
                name: apigateway-config

---
apiVersion: v1
kind: Service
metadata:
  name: apigatewayservice
spec:
  selector:
    app: apigatewayservice
  ports:
    - port: 8090
      targetPort: 8090
  type: NodePort