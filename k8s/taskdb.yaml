apiVersion: v1
kind: ConfigMap
metadata:
  name: taskdb-config
data:
  POSTGRES_DB: tasks
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskdb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: taskdb
  template:
    metadata:
      labels:
        app: taskdb
    spec:
      containers:
        - name: taskdb
          image: postgres:15
          ports:
            - containerPort: 5432
          envFrom:
            - configMapRef:
                name: taskdb-config

---
apiVersion: v1
kind: Service
metadata:
  name: taskdb
spec:
  selector:
    app: taskdb
  ports:
    - port: 5432
      targetPort: 5432
  type: ClusterIP