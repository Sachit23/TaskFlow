apiVersion: v1
kind: ConfigMap
metadata:
  name: userservice-config
data:
  USER_DB_URL: jdbc:postgresql://userdb:5432/users
  USER_DB_USERNAME: postgres
  USER_DB_PASSWORD: postgres
  SPRING_JPA_SHOW_SQL: "true"
  SPRING_JPA_HIBERNATE_DDL_AUTO: update

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: userservice
spec:
  replicas: 1
  selector:
    matchLabels:
      app: userservice
  template:
    metadata:
      labels:
        app: userservice
    spec:
      containers:
        - name: userservice
          image: user-service:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: userservice-config

---
apiVersion: v1
kind: Service
metadata:
  name: userservice
spec:
  selector:
    app: userservice
  ports:
    - port: 8080
      targetPort: 8080
  type: ClusterIP