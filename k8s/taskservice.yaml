apiVersion: v1
kind: ConfigMap
metadata:
  name: taskservice-config
data:
  TASK_DB_URL: jdbc:postgresql://taskdb:5432/tasks
  TASK_DB_USERNAME: postgres
  TASK_DB_PASSWORD: postgres
  USERSERVICE_URL: http://userservice:8080
  SPRING_JPA_SHOW_SQL: "true"
  SPRING_JPA_HIBERNATE_DDL_AUTO: update

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskservice
spec:
  replicas: 1
  selector:
    matchLabels:
      app: taskservice
  template:
    metadata:
      labels:
        app: taskservice
    spec:
      containers:
        - name: taskservice
          image: task-service:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
          envFrom:
            - configMapRef:
                name: taskservice-config

---
apiVersion: v1
kind: Service
metadata:
  name: taskservice
spec:
  selector:
    app: taskservice
  ports:
    - port: 8081
      targetPort: 8081
  type: ClusterIP