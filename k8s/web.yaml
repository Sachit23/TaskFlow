{
  "apiVersion": "v1",
  "kind": "List",
  "items": [
    {
      "apiVersion": "apps/v1",
      "kind": "Deployment",
      "metadata": {
        "name": "web"
      },
      "spec": {
        "replicas": 1,
        "selector": {
          "matchLabels": {
            "app": "web"
          }
        },
        "template": {
          "metadata": {
            "labels": {
              "app": "web"
            }
          },
          "spec": {
            "containers": [
              {
                "name": "web",
                "image": "taskflow/web:local",
                "imagePullPolicy": "IfNotPresent",
                "ports": [
                  {
                    "containerPort": 80
                  }
                ],
                "env": [
                  {
                    "name": "PUBLIC_ADDRESS",
                    "value": ":80"
                  }
                ],
                "resources": {
                  "requests": {
                    "cpu": "100m",
                    "memory": "128Mi"
                  },
                  "limits": {
                    "cpu": "1",
                    "memory": "256Mi"
                  }
                },
                "startupProbe": {
                  "httpGet": {
                    "path": "/healthz",
                    "port": 80
                  },
                  "failureThreshold": 60,
                  "periodSeconds": 5
                },
                "readinessProbe": {
                  "httpGet": {
                    "path": "/healthz",
                    "port": 80
                  },
                  "periodSeconds": 10
                },
                "livenessProbe": {
                  "httpGet": {
                    "path": "/healthz",
                    "port": 80
                  },
                  "periodSeconds": 20
                },
                "securityContext": {
                  "allowPrivilegeEscalation": false,
                  "capabilities": {
                    "drop": [
                      "ALL"
                    ],
                    "add": [
                      "NET_BIND_SERVICE"
                    ]
                  }
                }
              }
            ]
          }
        }
      }
    },
    {
      "apiVersion": "v1",
      "kind": "Service",
      "metadata": {
        "name": "web"
      },
      "spec": {
        "selector": {
          "app": "web"
        },
        "ports": [
          {
            "port": 80,
            "targetPort": 80
          }
        ],
        "type": "ClusterIP"
      }
    }
  ]
}
