apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: taskflow-ingress
spec:
  rules:
    - host: taskflow.local
      http:
        paths:
          - path: /api/users
            pathType: Prefix
            backend:
              service:
                name: userservice
                port:
                  number: 8080

          - path: /api/tasks
            pathType: Prefix
            backend:
              service:
                name: taskservice
                port:
                  number: 8081