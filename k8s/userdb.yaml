{
  "apiVersion": "v1",
  "kind": "List",
  "items": [
    {
      "apiVersion": "v1",
      "kind": "Service",
      "metadata": {
        "name": "userdb"
      },
      "spec": {
        "selector": {
          "app": "userdb"
        },
        "ports": [
          {
            "port": 5432,
            "targetPort": 5432
          }
        ]
      }
    },
    {
      "apiVersion": "apps/v1",
      "kind": "StatefulSet",
      "metadata": {
        "name": "userdb"
      },
      "spec": {
        "replicas": 1,
        "serviceName": "userdb",
        "selector": {
          "matchLabels": {
            "app": "userdb"
          }
        },
        "template": {
          "metadata": {
            "labels": {
              "app": "userdb"
            }
          },
          "spec": {
            "containers": [
              {
                "name": "userdb",
                "image": "postgres:17-alpine",
                "ports": [
                  {
                    "containerPort": 5432
                  }
                ],
                "env": [
                  {
                    "name": "POSTGRES_DB",
                    "value": "users"
                  },
                  {
                    "name": "POSTGRES_USER",
                    "valueFrom": {
                      "secretKeyRef": {
                        "name": "taskflow-db",
                        "key": "USER_DB_USERNAME"
                      }
                    }
                  },
                  {
                    "name": "POSTGRES_PASSWORD",
                    "valueFrom": {
                      "secretKeyRef": {
                        "name": "taskflow-db",
                        "key": "USER_DB_PASSWORD"
                      }
                    }
                  }
                ],
                "volumeMounts": [
                  {
                    "name": "data",
                    "mountPath": "/var/lib/postgresql/data",
                    "subPath": "postgres"
                  }
                ],
                "readinessProbe": {
                  "exec": {
                    "command": [
                      "sh",
                      "-c",
                      "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""
                    ]
                  },
                  "initialDelaySeconds": 5,
                  "periodSeconds": 5
                },
                "resources": {
                  "requests": {
                    "cpu": "100m",
                    "memory": "128Mi"
                  },
                  "limits": {
                    "cpu": "1",
                    "memory": "512Mi"
                  }
                }
              }
            ]
          }
        },
        "volumeClaimTemplates": [
          {
            "metadata": {
              "name": "data"
            },
            "spec": {
              "accessModes": [
                "ReadWriteOnce"
              ],
              "resources": {
                "requests": {
                  "storage": "8Gi"
                }
              }
            }
          }
        ]
      }
    }
  ]
}
